name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Stage npm package or finalize approved release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install npm with staged publishing support
        run: npm install --global npm@11

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Determine release state
        id: determine
        run: |
          set -euo pipefail

          PACKAGE_NAME=$(node -p "require('./package.json').name")
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          STABLE_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+$'
          RC_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'

          if [[ "$CURRENT_VERSION" =~ $STABLE_PATTERN ]]; then
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "$CURRENT_VERSION" =~ $RC_PATTERN ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported version format: $CURRENT_VERSION"
            echo "Allowed formats: X.Y.Z and X.Y.Z-rc.N"
            exit 1
          fi

          TAG_NAME="v$CURRENT_VERSION"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Check published and staged versions
        id: registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ steps.determine.outputs.dist_tag }}
        run: node scripts/npm-release-state.mjs

      - name: Install dependencies
        if: steps.registry.outputs.state == 'missing'
        run: npm ci

      - name: Lint
        if: steps.registry.outputs.state == 'missing'
        run: npm run lint

      - name: Typecheck
        if: steps.registry.outputs.state == 'missing'
        run: npm run typecheck

      - name: Build
        if: steps.registry.outputs.state == 'missing'
        run: npm run build

      - name: Test
        if: steps.registry.outputs.state == 'missing'
        run: npm run test

      - name: Runtime smoke test
        if: steps.registry.outputs.state == 'missing'
        run: node scripts/smoke-runtime.mjs

      - name: npm release state tests
        if: steps.registry.outputs.state == 'missing'
        run: node --test scripts/npm-release-state.node-tests.mjs

      - name: Check package contents
        if: steps.registry.outputs.state == 'missing'
        run: npm pack --dry-run

      - name: Select the published source commit
        if: steps.registry.outputs.state == 'published'
        env:
          RELEASE_COMMIT: ${{ steps.registry.outputs.release_commit }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          git checkout --detach "$RELEASE_COMMIT"

      - name: Generate release notes
        if: steps.registry.outputs.state == 'published'
        id: notes
        run: |
          set -euo pipefail
          CURRENT_VERSION="${{ steps.determine.outputs.current_version }}"
          BODY_FILE="$RUNNER_TEMP/release-notes.md"
          CURATED_FILE="docs/release-notes/v${CURRENT_VERSION}.md"

          # Prefer curated release notes committed alongside the version bump;
          # fall back to generating them from the commit log when absent.
          if [[ -f "$CURATED_FILE" ]]; then
            echo "Using curated release notes: $CURATED_FILE"
            cp "$CURATED_FILE" "$BODY_FILE"
          else
            echo "No curated release notes found; generating from commit log"
            node scripts/generate-release-notes.mjs \
              --version "$CURRENT_VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --output "$BODY_FILE"
          fi

          echo "body_file=$BODY_FILE" >> "$GITHUB_OUTPUT"

      - name: Stage npm package for 2FA approval
        if: steps.registry.outputs.state == 'missing'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.determine.outputs.dist_tag }}
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          if [ "$PRIVATE_REPOSITORY" = "true" ]; then
            npm stage publish --access public --tag "$DIST_TAG"
          else
            npm stage publish --access public --tag "$DIST_TAG" --provenance
          fi
          echo "Package staged. Review and approve it on npmjs with 2FA, then rerun Publish on main to create the GitHub release." >> "$GITHUB_STEP_SUMMARY"

      - name: Create and push git tag
        if: steps.registry.outputs.state == 'published'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG_NAME="${{ steps.determine.outputs.tag_name }}"
          RELEASE_COMMIT="${{ steps.registry.outputs.release_commit }}"
          if git show-ref --verify --quiet "refs/tags/$TAG_NAME"; then
            test "$(git rev-parse "$TAG_NAME^{commit}")" = "$RELEASE_COMMIT" || {
              echo "Existing release tag does not match the published package gitHead"
              exit 1
            }
          else
            git tag "$TAG_NAME" "$RELEASE_COMMIT"
            git push origin "$TAG_NAME"
          fi

      - name: Create GitHub release
        if: steps.registry.outputs.state == 'published'
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.determine.outputs.tag_name }}
          name: ${{ steps.determine.outputs.tag_name }}
          body_path: ${{ steps.notes.outputs.body_file }}
          prerelease: ${{ steps.determine.outputs.is_prerelease == 'true' }}
