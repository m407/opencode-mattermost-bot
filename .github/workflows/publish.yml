name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package and GitHub release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Determine release state
        id: determine
        run: |
          set -euo pipefail

          PACKAGE_NAME=$(node -p "require('./package.json').name")
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          STABLE_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+$'
          RC_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'

          if [[ "$CURRENT_VERSION" =~ $STABLE_PATTERN ]]; then
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "$CURRENT_VERSION" =~ $RC_PATTERN ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported version format: $CURRENT_VERSION"
            echo "Allowed formats: X.Y.Z and X.Y.Z-rc.N"
            exit 1
          fi

          TAG_NAME="v$CURRENT_VERSION"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          if git show-ref --verify --quiet "refs/tags/$TAG_NAME"; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check npm registry
        id: registry
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const url = `https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`;
          const response = await fetch(url, { signal: AbortSignal.timeout(30_000) });
          if (response.status !== 404 && !response.ok) {
            throw new Error(`npm registry returned HTTP ${response.status}; refusing to assume the version is unpublished`);
          }
          const shouldPublish = response.status === 404;
          if (!shouldPublish) {
            const published = await response.json();
            if (published.name !== name || published.version !== version) {
              throw new Error('Unexpected npm package metadata');
            }
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `should_publish=${shouldPublish}\n`);
          process.stdout.write(`${name}@${version}: ${shouldPublish ? 'ready to publish' : 'already published'}\n`);
          NODE

      - name: No release needed
        if: steps.determine.outputs.should_release != 'true' && steps.registry.outputs.should_publish != 'true'
        run: 'echo "Package version and Git tag already exist; nothing to publish"'

      - name: Install dependencies
        if: steps.determine.outputs.should_release == 'true' || steps.registry.outputs.should_publish == 'true'
        run: npm ci

      - name: Lint
        if: steps.determine.outputs.should_release == 'true' || steps.registry.outputs.should_publish == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.determine.outputs.should_release == 'true' || steps.registry.outputs.should_publish == 'true'
        run: npm run typecheck

      - name: Build
        if: steps.determine.outputs.should_release == 'true' || steps.registry.outputs.should_publish == 'true'
        run: npm run build

      - name: Test
        if: steps.determine.outputs.should_release == 'true' || steps.registry.outputs.should_publish == 'true'
        run: npm run test

      - name: Runtime smoke test
        if: steps.determine.outputs.should_release == 'true' || steps.registry.outputs.should_publish == 'true'
        run: node scripts/smoke-runtime.mjs

      - name: Check package contents
        if: steps.registry.outputs.should_publish == 'true'
        run: npm pack --dry-run

      - name: Generate release notes
        if: steps.determine.outputs.should_release == 'true'
        id: notes
        run: |
          set -euo pipefail
          CURRENT_VERSION="${{ steps.determine.outputs.current_version }}"
          BODY_FILE="$RUNNER_TEMP/release-notes.md"
          CURATED_FILE="docs/release-notes/v${CURRENT_VERSION}.md"

          # Prefer curated release notes committed alongside the version bump;
          # fall back to generating them from the commit log when absent.
          if [[ -f "$CURATED_FILE" ]]; then
            echo "Using curated release notes: $CURATED_FILE"
            cp "$CURATED_FILE" "$BODY_FILE"
          else
            echo "No curated release notes found; generating from commit log"
            node scripts/generate-release-notes.mjs \
              --version "$CURRENT_VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --output "$BODY_FILE"
          fi

          echo "body_file=$BODY_FILE" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: steps.registry.outputs.should_publish == 'true'
        env:
          # Optional for initial publication; omit after configuring npm Trusted Publishing.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "Private repository detected: publishing without provenance"
            npm publish --access public --tag ${{ steps.determine.outputs.dist_tag }}
          else
            echo "Public repository detected: publishing with provenance"
            npm publish --access public --tag ${{ steps.determine.outputs.dist_tag }} --provenance
          fi

      - name: Create and push git tag
        if: steps.determine.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.determine.outputs.tag_name }}"
          git push origin "${{ steps.determine.outputs.tag_name }}"

      - name: Create GitHub release
        if: steps.determine.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.determine.outputs.tag_name }}
          name: ${{ steps.determine.outputs.tag_name }}
          body_path: ${{ steps.notes.outputs.body_file }}
          prerelease: ${{ steps.determine.outputs.is_prerelease == 'true' }}
